name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$PWD/android/upload-keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - name: Name the artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "teleprompter-${GITHUB_REF_NAME}-arm64-v8a.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: teleprompter-*.apk
          generate_release_notes: true
