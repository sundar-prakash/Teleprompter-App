name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What did you expect instead?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Device and Android version, placeholder: Pixel 7, Android 14}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: App version, placeholder: 1.0.0}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs or screenshots, description: "`adb logcat -s flutter` output helps."}
